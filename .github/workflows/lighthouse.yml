name: Lighthouse
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./
          urls: |
            /index.html
            /about.html
            /certificates.html
          uploadArtifacts: true
          temporaryPublicStorage: true
